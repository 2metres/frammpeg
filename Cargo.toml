[package]
name = "frammpeg"
version = "0.1.0"
edition = "2021"
description = "Portable Rust desktop tool for debugging HTML/CSS animation bugs via annotated video frames."
authors = ["Andrew Carr <andrew@2metres.com>"]
license = "MIT"
publish = false

[dependencies]
eframe = "0.36.1"
egui = "0.36.1"
ffmpeg-sidecar = "2.5.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde-saphyr = "1.2.0"
arboard = "3.6.1"
rfd = "0.17.2"
dirs = "6.0.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
imageproc = { version = "0.27.0", default-features = false, features = ["text"] }
ab_glyph = "0.2"
resvg = { version = "0.48.1", default-features = false }
usvg = { version = "0.48.1", default-features = false }
tiny-skia = "0.12.0"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSAppearance", "NSApplication", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }

[dev-dependencies]
egui_kittest = "0.36.1"
insta = "1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints.rust]
unsafe_code = 'warn'
missing_docs = 'allow'
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = 'allow'
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
too_many_arguments = 'allow'
module_name_repetitions = 'allow'
