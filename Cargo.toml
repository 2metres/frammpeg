[package]
name = "frammpeg"
version = "0.1.0"
edition = "2021"
description = "Portable Rust desktop tool for debugging HTML/CSS animation bugs via annotated video frames."
authors = ["Andrew Carr <acarr@raywhite.com>"]
license = "MIT"
publish = false

[dependencies]
eframe = "0.36.1"
egui = "0.36.1"
ffmpeg-sidecar = "2.5.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
arboard = "3.6.1"
rfd = "0.17.2"
dirs = "6.0.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
imageproc = { version = "0.27.0", default-features = false, features = ["text"] }
ab_glyph = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
